<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Retailer Page</title>
</head>
<body>
    <header>
        <h1>Retailer Login</h1>
    </header>

    <section id="retailer-login">
        <form id="retailer-form">
            <label for="retailer-id">Retailer ID:</label>
            <input type="text" id="retailer-id" name="retailer-id" required>
            <button type="submit">Login</button>
        </form>
    </section>

    <section id="location-section" style="display: none;">
        <h2>Select Your Location</h2>
        <select id="location-select">
            <option value="location1">Location 1</option>
            <option value="location2">Location 2</option>
            <option value="location3">Location 3</option>
        </select>
        <button onclick="showDistributors()">Next</button>
    </section>

    <section id="distributors-section" style="display: none;">
        <h2>Available Distributors</h2>
        <div id="distributors-list"></div>
    </section>

    <section id="products" style="display: none;">
        <h2>Available Products</h2>
        <div id="products-list"></div>
    </section>

    <footer>
        <p>&copy; 2024 ABC Distributors</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
