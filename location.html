<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Select Location</title>
</head>
<body>
    <header>
        <h1>Select Your Location</h1>
    </header>
    <main>
        <form id="location-form" onsubmit="return showDistributors()">
            <label for="location">Choose your location:</label>
            <select id="location" required>
                <option value="" disabled selected>Select your location</option>
                <option value="location1">Location 1</option>
                <option value="location2">Location 2</option>
                <option value="location3">Location 3</option>
            </select>
            <button type="submit">Show Distributors</button>
        </form>
        <div id="distributor-list" style="display:none;">
            <h2>Available Distributors</h2>
            <ul id="distributors"></ul>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
