<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Products</title>
</head>
<body>
    <header>
        <h1>Products</h1>
    </header>
    <main>
        <div id="products">
            <h2>Available Products</h2>
            <div class="product">
                <h3>Product Name</h3>
                <p>Price: $10</p>
                <input type="number" placeholder="Quantity" min="1" id="quantity">
                <button id="add-to-cart">Add to Cart</button>
            </div>
            <!-- Add more products -->
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
