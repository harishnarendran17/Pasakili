<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer Login - PK Deals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Retailer Login</h1>
    <form action="brand_selection.html">
        <label for="location">Select Location:</label>
        <select id="location" name="location">
            <option value="chennai">Chennai</option>
            <option value="bangalore">Bangalore</option>
            <option value="mumbai">Mumbai</option>
        </select>

        <label for="distributor">Select Distributor:</label>
        <select id="distributor" name="distributor">
            <option value="dist1">Distributor 1</option>
            <option value="dist2">Distributor 2</option>
        </select>

        <button type="submit">Login</button>
    </form>
</body>
</html>
