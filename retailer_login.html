<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Retailer Login</title>
</head>
<body>
    <header>
        <h1>Retailer Login</h1>
    </header>
    <main>
        <form id="retailer-login" onsubmit="return login('retailer')">
            <label for="retailer-id">Enter your Retailer ID:</label>
            <input type="text" id="retailer-id" placeholder="e.g., RET12345" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="register_retailer.html">Register here</a></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
