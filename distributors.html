<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Distributor Page</title>
</head>
<body>
    <header>
        <h1>Distributor Login</h1>
    </header>

    <section id="distributor-login">
        <form id="distributor-form">
            <label for="distributor-id">Distributor ID:</label>
            <input type="text" id="distributor-id" name="distributor-id" required>
            <button type="submit">Login</button>
        </form>
    </section>

    <section id="orders" style="display: none;">
        <h2>Your Orders</h2>
        <p>No orders received yet.</p>
        <!-- Future functionality to display orders can be added here -->
    </section>

    <footer>
        <p>&copy; 2024 ABC Distributors</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
