<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1 class="fade-in">Welcome to the FMCG Portal</h1>
        <p class="fade-in">Select Login Type</p>
        <button id="retailerLogin" class="login-button slide-in-left">Login as Retailer</button>
        <button id="distributorLogin" class="login-button slide-in-right">Login as Distributor</button>
    </div>

    <script>
        document.getElementById('retailerLogin').addEventListener('click', function () {
            window.location.href = 'retailer_login.html';
        });

        document.getElementById('distributorLogin').addEventListener('click', function () {
            window.location.href = 'distributor_login.html';
        });
    </script>
</body>
</html>
