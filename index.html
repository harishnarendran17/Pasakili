<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #4CAF50;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 24px;
        }
        .login-section, .form-section, .products-section {
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-section, .products-section {
            display: none;
        }
        .form-section select, .form-section input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .products-section {
            margin-top: 40px;
        }
        .products-section ul {
            list-style-type: none;
            padding: 0;
        }
        .products-section ul li {
            background-color: #e0f7fa;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

<header>
    Retailer Portal - Login & Product Selection
</header>

<div class="login-section">
    <h2>Retailer Login</h2>
    <input type="text" id="retailerId" placeholder="Enter Retailer ID">
    <button onclick="login()">Login</button>
</div>

<div class="form-section">
    <h2>Select Your Location</h2>
    <select id="location" onchange="speakText('Location selected: ' + this.value)">
        <option value="">--Select Location--</option>
        <option value="New York">New York</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Chennai">Chennai</option>
        <option value="Bangalore">Bangalore</option>
    </select>

    <h2>Select a Brand</h2>
    <select id="brand" onchange="speakText('Brand selected: ' + this.value)">
        <option value="">--Select Brand--</option>
        <option value="Brand 1">Brand 1</option>
        <option value="Brand 2">Brand 2</option>
        <option value="Brand 3">Brand 3</option>
        <option value="Brand 4">Brand 4</option>
    </select>

    <h2>Select a Distributor for Your Location</h2>
    <select id="distributor" onchange="speakText('Distributor selected: ' + this.value)">
        <option value="">--Select Distributor--</option>
        <option value="Distributor A">Distributor A</option>
        <option value="Distributor B">Distributor B</option>
    </select>

    <button onclick="showProducts()">Show Products</button>
</div>

<div class="products-section">
    <h2>Available Products</h2>
    <ul>
        <li onclick="speakText('Product 1 selected')">Product 1</li>
        <li onclick="speakText('Product 2 selected')">Product 2</li>
        <li onclick="speakText('Product 3 selected')">Product 3</li>
        <li onclick="speakText('Product 4 selected')">Product 4</li>
    </ul>
</div>

<footer>
    © 2024 Retailer-Distributor Portal | Powered by Your Business
</footer>

<script>
    function login() {
        const retailerId = document.getElementById('retailerId').value;
        if (retailerId) {
            speakText('Welcome, Retailer ' + retailerId);
            document.querySelector('.login-section').style.display = 'none';
            document.querySelector('.form-section').style.display = 'block';
        } else {
            alert('Please enter your Retailer ID');
        }
    }

    function showProducts() {
        const location = document.getElementById('location').value;
        const brand = document.getElementById('brand').value;
        const distributor = document.getElementById('distributor').value;

        if (location && brand && distributor) {
            speakText('Showing products for ' + brand + ' from ' + distributor + ' in ' + location);
            document.querySelector('.form-section').style.display = 'none';
            document.querySelector('.products-section').style.display = 'block';
        } else {
            alert('Please select location, brand, and distributor');
        }
    }

    function speakText(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US'; // Change to desired language if needed
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
