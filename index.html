<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer-Distributor Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
</head>
<body>
    <header>
        <h1>Retailer-Distributor Platform</h1>
    </header>

    <div class="login-section">
        <h2>Login</h2>
        <button onclick="location.href='retailer.html'">Retailer Login</button>
        <button onclick="location.href='distributor.html'">Distributor Login</button>
    </div>

    <!-- Retailer Page -->
    <div id="retailer-page" class="page">
        <h2>Retailer Portal</h2>
        <label for="location">Select Location:</label>
        <select id="location">
            <option value="chennai">Chennai</option>
            <option value="bangalore">Bangalore</option>
            <option value="mumbai">Mumbai</option>
        </select>

        <label for="distributor">Select Distributor:</label>
        <select id="distributor">
            <option value="distributor1">Distributor 1</option>
            <option value="distributor2">Distributor 2</option>
            <option value="distributor3">Distributor 3</option>
        </select>

        <h3>Brands and Products</h3>
        <div class="brand">
            <h4>Brand 1</h4>
            <button class="add-to-cart" onclick="addToCart('Brand 1', 5)">Add to Cart (5 units)</button>
        </div>
        <div class="brand">
            <h4>Brand 2</h4>
            <button class="add-to-cart" onclick="addToCart('Brand 2', 3)">Add to Cart (3 units)</button>
        </div>

        <button onclick="checkout()">Checkout</button>
    </div>

    <!-- Distributor Page -->
    <div id="distributor-page" class="page">
        <h2>Distributor Portal</h2>
        <p>You have received <span id="order-count">5</span> orders today.</p>
    </div>

    <script>
        // Voice assistance function for adding items to the cart
        function addToCart(brand, quantity) {
            const message = `${quantity} units of ${brand} added to the cart.`;
            responsiveVoice.speak(message);
        }

        // Voice confirmation during checkout
        function checkout() {
            responsiveVoice.speak("Are you sure you want to proceed to checkout?");
        }
    </script>
</body>
</html>
